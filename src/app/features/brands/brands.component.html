<section class="py-24 bg-gradient-to-b from-gray-50 to-white">
  <div class="container mx-auto xl:w-[85%] px-4">

  
    
    <div class="mb-16 text-center">
      <h2 class="text-4xl md:text-5xl font-bold text-gray-900 tracking-tight">
        Our Trusted Brands
      </h2>
      <p class="mt-4 text-gray-500 text-sm md:text-base max-w-xl mx-auto">
        We partner with world-class brands to deliver premium quality products
      </p>
    </div>

    
    
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-8">

      @for (brand of brandsList(); track brand._id) {

        <div
          class="group relative bg-white rounded-3xl border border-gray-100 p-6 flex flex-col items-center justify-center transition-all duration-300 hover:shadow-xl hover:-translate-y-2 cursor-pointer overflow-hidden"
        >

        
        
          <div class="absolute inset-0 bg-gradient-to-tr from-indigo-100 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition duration-500"></div>

          
          <div class="relative z-10 flex items-center justify-center h-20">
            <img
              [src]="brand.image"
              [alt]="brand.name"
              class="max-h-16 object-contain grayscale group-hover:grayscale-0 group-hover:scale-110 transition duration-300"
            />
          </div>

          
          <h3 class="relative z-10 mt-5 text-sm font-semibold text-gray-600 group-hover:text-indigo-600 transition">
            {{ brand.name }}
          </h3>

        </div>

      }

    </div>

  </div>
</section>
