<section class="py-20 bg-gray-50 min-h-screen">
  <div class="container xl:w-[90%] mx-auto px-4">

   
    
    <div class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">

      @for (product of productList(); track product._id) {

        <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition duration-300 overflow-hidden flex flex-col group">

         
          
          <div
            class="relative cursor-pointer overflow-hidden"
            [routerLink]="['/main/details', product._id]"
          >

            <img
              [src]="product.imageCover"
              [alt]="product.title"
              class="w-full h-48 object-cover group-hover:scale-110 transition duration-500"
            />

          
            
            <div class="absolute top-2 right-2 bg-white/90 backdrop-blur px-2 py-1 rounded-lg text-xs flex items-center gap-1 shadow">
              <i class="fas fa-star text-yellow-400 text-xs"></i>
              {{ product.ratingsAverage }}
            </div>

          </div>

          
          
          <div class="p-4 flex flex-col flex-1">

            <h3 class="text-xs text-green-600 mb-1">
              {{ product.category.name }}
            </h3>

            <h4 class="text-sm font-semibold text-gray-800 line-clamp-2 flex-1">
              {{ product.title }}
            </h4>

          
            
            <div class="mt-3 flex items-center justify-between">
              <span class="font-bold text-gray-900">
                {{ product.price }} EGP
              </span>
            </div>

          </div>

       
          
          <div class="px-4 pb-4">
            <button
              (click)="AddProductitems(product.id)"
              class="w-full py-2 rounded-lg bg-green-600 text-white font-medium opacity-0 translate-y-6 group-hover:opacity-100 group-hover:translate-y-0 transition duration-300 hover:bg-green-700"
            >
              Add to Cart
            </button>
          </div>

        </div>

      }

    </div>

  </div>
</section>
