<section class="py-20 bg-gradient-to-b from-gray-50 to-white">
  <div class="container xl:w-[90%] mx-auto px-4">

  
    
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl md:text-3xl font-semibold text-gray-900">
        Shop Popular Categories
      </h2>
    </div>

    
    <owl-carousel-o [options]="categoriesCustomOptions">

      @for (category of categorieslist(); track category._id) {

        <ng-template carouselSlide [id]="category._id">

          <div class="group cursor-pointer">

            
            <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition duration-300 overflow-hidden">

             
              
              <div class="overflow-hidden">
                <img
                  [src]="category.image"
                  [alt]="category.name"
                  [title]="category.name"
                  class="w-full h-44 object-cover group-hover:scale-110 transition duration-500"
                />
              </div>

              
              <div class="p-4 text-center">
                <h3 class="text-sm font-semibold text-gray-700 group-hover:text-green-600 transition">
                  {{ category.name }}
                </h3>
              </div>

            </div>

          </div>

        </ng-template>

      }

    </owl-carousel-o>

  </div>
</section>
